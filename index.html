<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Dictionary web app</title>
</head>
<body>
  <main class="main-container">
    <div class="container">
      <header class="header-container">
        <div class="logo">
          <img src="./assets/images/logo.svg" alt="Dictionary logo">
        </div>

        <div class="right-container">
          <button 
            class="font-selector-container" 
            type="button" 
            aria-label="Select font"
            aria-controls="font-menu"
            aria-expanded="false">
            <span class="font-text">Mono</span>
            <img class="font-img" src="./assets/images/icon-arrow-down.svg" alt="" aria-hidden="true">
          </button>

          <div class="popup" id="font-menu" aria-hidden="true">
            <button type="button" class="pop-btn sans-serif">Sans Serif</button>
            <button type="button" class="pop-btn serif">Serif</button>
            <button type="button" class="pop-btn mono">Mono</button>
          </div>

          <div class="rectangle"></div> <!-- Don't remove - required for visual layout -->

          <label class="theme-selector-container" for="theme-logo">
            <svg 
              xmlns="http://www.w3.org/2000/svg" 
              width="20" 
              height="20" 
              viewBox="0 0 22 22"
            >
            
            <path 
              fill="none" 
              stroke="currentColor" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              stroke-width="1.5" 
              d="M1 10.449a10.544 10.544 0 0 0 19.993 4.686C11.544 15.135 6.858 10.448 6.858 1A10.545 10.545 0 0 0 1 10.449Z"
            />
            </svg>

            <span class="switch">
              <input type="checkbox" id="theme-logo">
              <span class="slider"></span>
            </span>

            <span class="visually-hidden">
              Toggle dark theme
            </span>

            <svg 
              xmlns="http://www.w3.org/2000/svg" 
              width="20" 
              height="20" 
              viewBox="0 0 24 24" 
              fill="none"
              aria-hidden="true"
            >
            
              <circle 
                cx="12" 
                cy="12" 
                r="4" 
                stroke="currentColor" 
                stroke-width="2"
              />

              <path 
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                stroke="currentColor" 
                stroke-width="2" 
                stroke-linecap="round"
              />
            </svg>
          </label>
        </div>
      </header>

      <form class="search-container">
        <label class="visually-hidden" for="search-input">
          Search for a word.
        </label>
        <input type="search" id="search-input" placeholder="Search for any word...">

        <p class="error-text hidden">Whoops, can't be empty...</p>

        <button type="submit" class="search-button" aria-label="Search for a word">
          <img src="./assets/images/icon-search.svg" alt="" class="search-img" aria-hidden="true">
        </button>
      </form>

      <section class="pronunciation-container">
        <div class="word-pronunciation-container">
          <p class="word"></p>
          <p class="pronunciation"></p>
        </div>

        <button 
          class="pronunciation-button hidden" 
          type="button" 
          aria-label="Play pronunciation">
          <img src="./assets/images/icon-play.svg" alt=""  class="pronunciation-img" aria-hidden="true">
        </button>
      </section>

      <section class="partOfSpeech-section">
        
      </section>
    </div>
  </main>

  <section class="error-container hidden">
      <div class="message">

      </div>

      <p class="error-message-sorry">
        Sorry pal, we couldn't find definitions for the word you were looking for. You can try the search again at later time or head to the web instead.

  </section>

</body>
</html>
