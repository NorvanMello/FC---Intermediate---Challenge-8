<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Dictionary web app</title>
</head>
<body>
  <main class="main-container">
    <div class="container">
      <header class="header-container">
        <div class="logo">
          <img src="./assets/images/logo.svg" alt="">
        </div>

        <div class="right-container">
          <div class="font-selector-container">
            <p class="font-text">Sans Serif</p>
            <img class="font-img" src="./assets/images/icon-arrow-down.svg" alt="">
          </div>

          <div class="rectangle"></div>

          <div class="theme-selector-container">
            <label class="switch">
              <input type="checkbox">
              <span class="slider"></span>
            </label>

            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M1 10.449a10.544 10.544 0 0 0 19.993 4.686C11.544 15.135 6.858 10.448 6.858 1A10.545 10.545 0 0 0 1 10.449Z"/></svg>
          </div>
        </div>
      </header>

      <form class="search-container">
        <label class="visually-hidden" for="search-input">
          Search for a word.
        </label>
        <input type="search" id="search-input" placeholder="Search for any word...">
        <img src="./assets/images/icon-search.svg" alt="" class="search-img">
      </form>

      <section class="pronunciation-container">
        <div class="word-pronunciation-container">
          <p class="word">Keyboard</p>
          <p class="pronunciation">/ˈkiːbɔːd/</p>
        </div>

        <img src="./assets/images/icon-play.svg" alt="" class="pronunciation-img">
      </section>

      <section class="noun-section">

      </section>

      <section class="verb-section">

      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
